<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>온씨네</title>

  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#ffffff" />

  <link rel="stylesheet" href="styles.css" />

  <!-- Leaflet (지도 라이브러리) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
</head>

<body>
  <header class="header">
    <div>
      <h1>온씨네 영화지도</h1>
      <p class="sub">내 주변 영화관을 빠르게 찾아요</p>
    </div>

    <div class="actions">
      <button id="btnSenior" class="btn">쉬운 모드: OFF</button>
      <button id="btnLocate" class="btn">내 위치로</button>
      <select id="radius" class="select" aria-label="검색 반경">
        <option value="1500">1.5km</option>
        <option value="3000" selected>3km</option>
        <option value="5000">5km</option>
        <option value="10000">10km</option>
      </select>
      <button id="btnSearch" class="btn primary">주변 검색</button>
    </div>
  </header>

  <main class="layout">
    <section class="panel">
      <div class="status" id="status">준비됨</div>
      <div class="filters hidden" id="filters">
        <button id="btnFilterAll" class="filterBtn active">전체</button>
        <button id="btnFilterMultiplex" class="filterBtn">멀티플렉스</button>
        <button id="btnFilterIndie" class="filterBtn">독립·기타</button>
      </div>
      <div class="legend hidden" id="legend">
        <div class="legend-item"><span class="legend-dot multiplex"></span> 멀티플렉스</div>
        <div class="legend-item"><span class="legend-dot indie"></span> 독립·기타</div>
        <div class="legend-item"><span class="legend-dot user"></span> 내 위치</div>
      </div>
      <ul class="list" id="list"></ul>
    </section>

    <section class="mapWrap">
      <div id="map" class="map"></div>
    </section>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="app.js"></script>

  <div id="coach" class="coach hidden" role="dialog" aria-live="polite" aria-label="안내">
    <div class="coachCard">
      <div id="coachTitle" class="coachTitle">안내</div>
      <div id="coachText" class="coachText">내용</div>
      <div class="coachActions">
        <button id="coachNext" class="btn primary">다음</button>
        <button id="coachClose" class="btn">닫기</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast hidden" aria-live="polite"></div>

</body>

</html>
